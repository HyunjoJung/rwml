name: Render Oracle (Diagnostic)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "examples/to_pdf.rs"
      - "scripts/**"
      - "tests/test_*.py"
      - "corpus/public/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rwml-fonts/**"
      - ".github/workflows/render-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Diagnostic evidence integrity (12 documents)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_REVISION: ${{ github.sha }}
      RUSTFLAGS: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize diagnostic logs
        timeout-minutes: 1
        run: |
          mkdir -p target/oracle-ci/logs
          printf '%s\n' "$SOURCE_REVISION" > target/oracle-ci/logs/source-revision.txt
      - uses: dtolnay/rust-toolchain@1.92.0
        timeout-minutes: 3
      - uses: actions/setup-python@v7
        timeout-minutes: 2
        with:
          python-version: "3.13"
      - name: Install native build and analysis prerequisites
        timeout-minutes: 5
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev pkg-config
            python -m pip install --disable-pip-version-check --no-cache-dir \
              PyMuPDF==1.28.2 Pillow==12.3.0 numpy==2.4.4
            # Offline native builds need every target-specific locked crate.
            cargo fetch --locked
          } 2>&1 | tee target/oracle-ci/logs/prerequisites.log
      - name: Verify public inputs and prepare locked downloads
        timeout-minutes: 5
        run: |
          set -o pipefail
          {
            python scripts/public_hygiene_audit.py
            python scripts/generate_render_smoke_manifest.py --check
            python scripts/prepare_render_oracle_ci.py \
              --output target/oracle-ci/prepared --cache target/oracle-ci/downloads
          } 2>&1 | tee target/oracle-ci/logs/preparation.log
      - name: Read the validated image build lock
        id: lock
        timeout-minutes: 1
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "scripts")
          import libreoffice_container as runtime
          build = runtime.load_runtime_lock()["build"]
          print("buildx=v" + build["buildx_version"])
          print("buildkit=" + build["buildkit_image"])
          print("epoch=" + str(build["source_date_epoch"]))
          PY
      - uses: docker/setup-buildx-action@v4
        id: builder
        timeout-minutes: 2
        with:
          version: ${{ steps.lock.outputs.buildx }}
          driver-opts: image=${{ steps.lock.outputs.buildkit }}
          buildkitd-flags: --oci-worker-snapshotter=native
      - name: Build and verify the digest-locked LibreOffice image
        id: image
        timeout-minutes: 12
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
          SOURCE_DATE_EPOCH: ${{ steps.lock.outputs.epoch }}
        run: |
          set -o pipefail
          {
            docker buildx build --builder "$BUILDER" --platform linux/amd64 \
              --file target/oracle-ci/prepared/context/Containerfile \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              --no-cache --provenance=false --sbom=false --progress=plain \
              --output type=docker,dest=target/oracle-ci/image.tar,rewrite-timestamp=true,oci-mediatypes=false \
              target/oracle-ci/prepared/context
            docker load --input target/oracle-ci/image.tar
            python scripts/libreoffice_container.py inspect
          } 2>&1 | tee target/oracle-ci/logs/image.log
      - name: Capture and independently verify the complete smoke pair
        id: capture
        # Two captures, two measurements and their independent repeat perform six
        # fresh native builds. Leave job time for failed partial evidence upload.
        timeout-minutes: 22
        run: |
          set -o pipefail
          python -u scripts/render_oracle_ci.py \
            --prepared target/oracle-ci/prepared \
            --output target/oracle-ci/evidence \
            --source-revision "$SOURCE_REVISION" \
            2>&1 | tee target/oracle-ci/logs/capture.log
      - name: Retain diagnostics, including failed preparation and partial captures
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: render-oracle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/oracle-ci/logs
            target/oracle-ci/evidence
          if-no-files-found: error
          retention-days: 14
